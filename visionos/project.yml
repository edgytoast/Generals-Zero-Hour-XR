# XcodeGen spec for the native visionOS shell of Generals: Zero Hour XR.
#
#   xcodegen generate --spec visionos/project.yml   (build-shell.sh does this)
#
# The generated GeneralsZHXR.xcodeproj is a build artifact and is git-ignored.
# Signing is intentionally NOT configured here: the simulator build needs none,
# the unsigned device compile passes CODE_SIGNING_ALLOWED=NO, and a real device
# build takes DEVELOPMENT_TEAM from the environment / local Xcode settings.
name: GeneralsZHXR
options:
  bundleIdPrefix: com.generalsx.zerohour.xr
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    visionOS: "26.0"
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++20"
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_MODULES: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    ENABLE_USER_SCRIPT_SANDBOXING: NO   # the ANGLE check/embed scripts read outside the project
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64                 # ANGLE (and the engine) are built for arm64 only; no x86_64 simulator slice
    ONLY_ACTIVE_ARCH: NO
targets:
  GeneralsZHXR:
    type: application
    platform: visionOS
    sources:
      - path: App
      - path: Bridge
      - path: Renderer
      - path: ANGLE
      - path: Input
      - path: GameData
      - path: UI
      - path: Platform
        buildPhase: none        # headers only; referenced through HEADER_SEARCH_PATHS
      - path: Resources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: GeneralsZHXR
        PRODUCT_BUNDLE_IDENTIFIER: com.generalsx.zerohour.xr.vision
        SDKROOT: xros
        SUPPORTED_PLATFORMS: "xros xrsimulator"
        TARGETED_DEVICE_FAMILY: "7"
        SWIFT_OBJC_BRIDGING_HEADER: App/GeneralsZHXR-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/App
          - $(SRCROOT)/Bridge
          - $(SRCROOT)/Renderer
          - $(SRCROOT)/ANGLE
          - $(SRCROOT)/Input
          - $(SRCROOT)/GameData
          - $(SRCROOT)/Platform
          - $(SRCROOT)/Audio        # GXAudioListener.h (header only here; the audio host sources are wired by their own package)
          # Engine host headers (GXEngineHost.h, GXEngineHostServices.h): plain C, included straight from the engine tree so the
          # relative include of Platform/XRPresentation.h inside them resolves (the xcframework copy is only for linking).
          - $(SRCROOT)/../GeneralsMD/Code/Main/visionos
          - $(GX_ANGLE_ROOT)/$(PLATFORM_NAME)/include
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
        # ANGLE (GLES 3.0 on Metal), built by scripts/build/visionos/build-angle.sh. GX_ANGLE_ROOT is the
        # install root containing xrsimulator/ and xros/ (each with include/ and lib/). The default is
        # build-angle.sh's default install location; build-shell.sh passes $GX_ANGLE_ROOT through, and
        # in the Xcode GUI it can be set as a user-defined build setting.
        # GX_ANGLE_LINK: "static" (default; libANGLE.a + libtranslator.a linked into the executable, nothing
        # to embed or sign) or "shared" (libANGLE-shared.dylib embedded in Frameworks/ and signed).
        GX_ANGLE_ROOT: /Users/jvadala/CandC/deps/angle/install
        GX_ANGLE_LINK: static
        GX_ANGLE_LDFLAGS_static: "$(GX_ANGLE_ROOT)/$(PLATFORM_NAME)/lib/libANGLE.a $(GX_ANGLE_ROOT)/$(PLATFORM_NAME)/lib/libtranslator.a -lz -framework QuartzCore -framework CoreGraphics -framework IOSurface -framework Foundation"
        GX_ANGLE_LDFLAGS_shared: "-L$(GX_ANGLE_ROOT)/$(PLATFORM_NAME)/lib -lANGLE-shared"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks"
        # System frameworks / libraries the merged engine archive needs (link-flags.txt written by make-xcframework.sh;
        # build-shell.sh passes the file's current content). This default is the list recorded for the reference build.
        # The engine is consumed from GeneralsZHEngine.xcframework (built by build-engine.sh + make-xcframework.sh; path in
        # GX_ENGINE_XCFRAMEWORK, exported by build-shell.sh, default <repo>/build/xcframework/...) by linking the slice's
        # archive directly. It is NOT added as an Xcode framework dependency: Xcode would then publish the xcframework's
        # module map (an umbrella over C++ headers) and the bridging header could not import GXEngineHost.h.
        GX_ENGINE_XCFRAMEWORK: $(SRCROOT)/../build/xcframework/GeneralsZHEngine.xcframework
        GX_ENGINE_SLICE: xros-arm64
        "GX_ENGINE_SLICE[sdk=xrsimulator*]": xros-arm64-simulator
        GX_ENGINE_LIB: "$(GX_ENGINE_XCFRAMEWORK)/$(GX_ENGINE_SLICE)/libGeneralsZHEngine_all.a"
        GX_ENGINE_LDFLAGS: "-lpthread -ldl -lm -lobjc -lc++ -framework SystemConfiguration -framework CoreServices -framework AudioToolbox -framework CoreFoundation -framework CoreAudio -framework CoreVideo -framework CoreMedia -framework AVFoundation -framework CoreGraphics -framework Foundation -framework ImageIO -framework MobileCoreServices -framework UIKit -framework QuartzCore"
        OTHER_LDFLAGS:
          - -framework
          - CompositorServices
          - -framework
          - ARKit
          - -framework
          - Metal
          - "$(GX_ANGLE_LDFLAGS_$(GX_ANGLE_LINK))"
          - "$(GX_ENGINE_LIB)"
          - "$(GX_ENGINE_LDFLAGS)"
    preBuildScripts:
      - name: Check engine xcframework
        basedOnDependencyAnalysis: false
        script: |
          set -e
          case "$PLATFORM_NAME" in xrsimulator) SLICE=xros-arm64-simulator; FLAG=simulator ;; *) SLICE=xros-arm64; FLAG=device ;; esac
          XCF="${GX_ENGINE_XCFRAMEWORK:-$SRCROOT/../build/xcframework/GeneralsZHEngine.xcframework}"
          if [ ! -f "$XCF/$SLICE/libGeneralsZHEngine_all.a" ]; then
            echo "error: the engine library for $PLATFORM_NAME is missing ($XCF/$SLICE). Build it with: scripts/build/visionos/build-engine.sh --$FLAG && scripts/build/visionos/make-xcframework.sh   (or run scripts/build/visionos/build-shell.sh, which does it)" >&2
            exit 1
          fi
      - name: Check ANGLE
        basedOnDependencyAnalysis: false
        script: |
          set -e
          LIB="$GX_ANGLE_ROOT/$PLATFORM_NAME/lib"
          if [ "$GX_ANGLE_LINK" = "shared" ]; then NEED="$LIB/libANGLE-shared.dylib"; else NEED="$LIB/libANGLE.a"; fi
          if [ ! -f "$NEED" ] || [ ! -d "$GX_ANGLE_ROOT/$PLATFORM_NAME/include/EGL" ]; then
            echo "error: ANGLE for $PLATFORM_NAME not found under GX_ANGLE_ROOT=$GX_ANGLE_ROOT (missing $NEED). Build it with: scripts/build/visionos/build-angle.sh all   (or set GX_ANGLE_ROOT to an existing install)" >&2
            exit 1
          fi
    postBuildScripts:
      - name: Embed ANGLE (shared link only)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          [ "$GX_ANGLE_LINK" = "shared" ] || exit 0
          SRC="$GX_ANGLE_ROOT/$PLATFORM_NAME/lib/libANGLE-shared.dylib"
          DEST="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          mkdir -p "$DEST"
          cp -f "$SRC" "$DEST/libANGLE-shared.dylib"
          # Re-sign with the app's identity (ad-hoc "-" on the simulator). Unsigned device builds skip signing.
          if [ "$CODE_SIGNING_ALLOWED" != "NO" ] && [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
            /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none "$DEST/libANGLE-shared.dylib"
          fi
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Generals ZH XR
        CFBundleName: GeneralsZHXR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSceneManifest:
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSHandsTrackingUsageDescription: "Hand tracking lets you pinch, drag and use both hands to move and scale the tabletop battlefield."
        NSWorldSensingUsageDescription: "World sensing places the battlefield in front of you and keeps it fixed in your room."
        UIRequiredDeviceCapabilities:
          - arm64
